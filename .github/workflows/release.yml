name: build

# Builds the Tauri app on Windows.
#  - PRs to main         -> build only (verify the PR compiles)
#  - pushes to main      -> build only (incl. PR merges — verify main compiles)
#  - pushing a v* tag    -> build + publish a GitHub release (live, not draft)
#  - workflow_dispatch   -> manual run from the Actions tab
#
# Releases publish directly (no draft). The tag push is the publish trigger,
# and the in-app self-updater (queries releases/latest) picks the new version
# up on the next launch.
#
# A release pushes main and a v* tag at the same commit, which would fire two
# runs. The `concurrency` block below groups runs by commit SHA and cancels the
# older one, so a release collapses to a single run — the tag run, which
# publishes — and an ordinary PR merge still gets its own build.
#
# To cut a release:
#   1. Bump the version in package.json, src-tauri/Cargo.toml and
#      src-tauri/tauri.conf.json (all three must match).
#   2. Commit + push, then: git tag v3.2.0 && git push origin v3.2.0
#   3. Wait for this workflow — release goes live automatically.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Collapse the duplicate run a release creates (main push + tag push at the
# same commit) into one. Runs for different commits have different SHAs, so an
# ordinary PR merge is never cancelled by an unrelated build.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

# GitHub switches JavaScript actions to Node 24 on 2026-06-16; the pinned v4
# actions still default to Node 20. Opt in ahead of the cutover so it can't
# break a release run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Windows installer + portable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # The MSVC toolchain is the default on windows-latest runners, and
      # src-tauri/rust-toolchain.toml pins stable-x86_64-pc-windows-msvc —
      # rustup auto-installs it on the first cargo invocation.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Quality gate: a failing test or type error fails the job before any
      # artifact is built, so a broken build can never publish a release.
      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # Rust tests run here too — `tauri build` compiles the non-test profile,
      # so without this step a failing or non-compiling test would still publish.
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build (vite + tauri)
        run: npm run build:win

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeuMultiTool-Portable
          path: src-tauri/target/release/beu-multitool.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeuMultiTool-Installer
          path: src-tauri/target/release/bundle/nsis/BeuMultiTool_*_x64-setup.exe
          if-no-files-found: error

      # Only tag pushes create a release. beu-multitool.exe MUST keep this
      # exact filename — it's the asset the in-app self-updater downloads
      # (ASSET_NAME in src-tauri/src/update.rs).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          make_latest: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/beu-multitool.exe
            src-tauri/target/release/bundle/nsis/BeuMultiTool_*_x64-setup.exe

  # macOS build (Apple Silicon / arm64). Cross-compiling to macOS from the
  # Windows runner isn't possible, so this runs on a native macOS runner.
  #  - PR / push           -> unsigned build (verify it compiles + bundles).
  #                           No signing key needed.
  #  - pushing a v* tag    -> signs the .app.tar.gz, writes the updater manifest
  #                           (latest.json), and uploads everything to the same
  #                           release the Windows job created.
  #
  # `needs: build` serialises release publishing: the Windows job creates the
  # release first, then this job appends the macOS assets — so there's no race
  # to create the same release twice.
  #
  # The app is NOT Apple-notarised (no Developer ID). The .dmg therefore carries
  # a quarantine flag on download; first-launch instructions live in README.md.
  # The in-app updater still works because the plugin replaces the bundle
  # directly (no quarantine on the downloaded .app.tar.gz).
  build-macos:
    name: Build macOS app (Apple Silicon)
    needs: build
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Add macOS arm64 Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # PR / push: build unsigned so a macOS-breaking change is caught without
      # needing the signing secret. No updater artifacts are produced here.
      - name: Build (unsigned - verification)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run tauri -- build --target aarch64-apple-darwin --config src-tauri/tauri.macos.conf.json

      # Tag: also emit the signed updater artifact (.app.tar.gz + .sig). Requires
      # the TAURI_SIGNING_PRIVATE_KEY secret (the private half of the key whose
      # public half is pinned in tauri.macos.conf.json).
      - name: Build (signed - release)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target aarch64-apple-darwin --config src-tauri/tauri.macos.conf.json --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeuMultiTool-macOS-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # The updater reads this manifest from releases/latest/download/latest.json
      # (the endpoint pinned in tauri.macos.conf.json). `signature` must be the
      # CONTENT of the .sig file, and `url` the versioned asset URL.
      - name: Generate updater manifest (latest.json)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle"
          SIG="$(cat "$BUNDLE/macos/BeuMultiTool.app.tar.gz.sig")"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/BeuMultiTool.app.tar.gz"
          jq -n \
            --arg v "$VERSION" \
            --arg sig "$SIG" \
            --arg url "$URL" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, pub_date: $date, platforms: {"darwin-aarch64": {signature: $sig, url: $url}}}' \
            > latest.json
          cat latest.json

      # Append macOS assets to the release the Windows job already created. Only
      # `files` is set so the release name/notes/latest flag stay untouched.
      - name: Publish macOS assets to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/BeuMultiTool.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/BeuMultiTool.app.tar.gz.sig
            latest.json
