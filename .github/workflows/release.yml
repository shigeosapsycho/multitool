name: build

# Builds the Tauri app on Windows.
#  - PRs to main         -> build only (verify main still compiles)
#  - pushing a v* tag    -> build + create a DRAFT GitHub release
#  - workflow_dispatch   -> manual run from the Actions tab
#
# Plain pushes to main are NOT built — when you tag a release, pushing main
# and pushing the tag would otherwise fire two duplicate runs. Only the tag
# run produces the release the in-app self-updater needs, so the main-push
# trigger is omitted.
#
# The release is a DRAFT on purpose: review the attached files, then click
# Publish. The in-app self-updater only sees PUBLISHED releases (it queries
# releases/latest), so a draft ships nothing until you publish it.
#
# To cut a release:
#   1. Bump the version in package.json, src-tauri/Cargo.toml and
#      src-tauri/tauri.conf.json (all three must match).
#   2. Commit + push, then: git tag v3.1.2 && git push origin v3.1.2
#   3. Wait for this workflow, review the draft release, click Publish.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer + portable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # The MSVC toolchain is the default on windows-latest runners, and
      # src-tauri/rust-toolchain.toml pins stable-x86_64-pc-windows-msvc —
      # rustup auto-installs it on the first cargo invocation.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build (vite + tauri)
        run: npm run build:win

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeuMultiTool-Portable
          path: src-tauri/target/release/beu-multitool.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeuMultiTool-Installer
          path: src-tauri/target/release/bundle/nsis/BeuMultiTool_*_x64-setup.exe
          if-no-files-found: error

      # Only tag pushes create a release. beu-multitool.exe MUST keep this
      # exact filename — it's the asset the in-app self-updater downloads
      # (ASSET_NAME in src-tauri/src/update.rs).
      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/beu-multitool.exe
            src-tauri/target/release/bundle/nsis/BeuMultiTool_*_x64-setup.exe
