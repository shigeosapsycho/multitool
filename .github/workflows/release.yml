name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer + portable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-builder
          restore-keys: |
            ${{ runner.os }}-electron-builder

      - name: Install dependencies
        run: npm ci

      # PRs build only (no publish — never push artifacts from a fork's branch).
      - name: Build (PR check, no publish)
        if: github.event_name == 'pull_request'
        run: npm run build:win

      # Pushes to main and v* tags both publish. electron-builder uploads to a
      # release tagged with package.json's `version` (creating it if missing).
      - name: Build & publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeuMultiTool-Installer
          path: release/BeuMultiTool-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeuMultiTool-Portable
          path: release/BeuMultiTool.exe
          if-no-files-found: error
