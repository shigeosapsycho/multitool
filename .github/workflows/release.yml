name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer + portable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-builder
          restore-keys: |
            ${{ runner.os }}-electron-builder

      - name: Install dependencies
        run: npm ci

      # On regular commits / PRs: build only (--publish never so CI skips upload).
      - name: Build (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build:win

      # On v* tag pushes: build AND publish to GitHub Release with auto-updater metadata.
      - name: Build & publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeuMultiTool-Installer
          path: release/BeuMultiTool-Setup-*.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeuMultiTool-Portable
          path: release/BeuMultiTool.exe
          if-no-files-found: error
