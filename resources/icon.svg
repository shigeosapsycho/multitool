<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a26" />
      <stop offset="100%" stop-color="#0a0a10" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c5cff" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Rounded-square dark background -->
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bg)" />
  <!-- Subtle inner glow behind the mark -->
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#glow)" />
  <!-- Inner stroke for definition -->
  <rect x="1" y="1" width="254" height="254" rx="47" fill="none" stroke="#2a2a3a" stroke-width="1" />

  <!-- 2x2 grid of rounded squares, graduated purple, accent in bottom-right -->
  <rect x="58" y="58" width="64" height="64" rx="14" fill="#3a2f6e" />
  <rect x="134" y="58" width="64" height="64" rx="14" fill="#5a45c4" />
  <rect x="58" y="134" width="64" height="64" rx="14" fill="#5a45c4" />
  <rect x="134" y="134" width="64" height="64" rx="14" fill="url(#accent)" />
</svg>
