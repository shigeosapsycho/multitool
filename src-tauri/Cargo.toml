[package]
name = "beu-multitool"
version = "3.1.3"
description = "Beu MultiTool - desktop edition"
authors = ["beu"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "beu_multitool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
notify-debouncer-mini = "0.4"
trash = "5"
chrono = "0.4"
rand = "0.8"
anyhow = "1"
# Self-updater HTTP client (GitHub Releases API + asset download).
ureq = { version = "2", features = ["json", "socks-proxy"] }
base64 = "0.22"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
