[package]
name = "beu-multitool"
version = "3.23.0"
description = "Beu MultiTool - desktop edition"
authors = ["beu"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "beu_multitool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
notify-debouncer-mini = "0.4"
trash = "5"
chrono = "0.4"
rand = "0.8"
anyhow = "1"
# Self-updater HTTP client (GitHub Releases API + asset download).
# default-features off drops ureq's rustls stack (rustls + ring + webpki-roots)
# from the Windows binary; HTTPS goes through native-tls/schannel instead,
# which imap already requires. With rustls off ureq has NO default TLS backend,
# so every agent must be built via crate::http::agent_builder() — a bare
# ureq::AgentBuilder/ureq::get cannot reach https. "gzip" is kept because the
# default build had it.
ureq = { version = "2", default-features = false, features = ["json", "gzip", "socks-proxy", "native-tls"] }
base64 = "0.22"
url = "2"
# Email Cleaner module: IMAP client + OS credential storage.
# `keyring` is platform-specific — see the per-OS [target.*.dependencies] tables
# below (windows-native on Windows, apple-native on macOS).
imap = "2.4"
native-tls = "0.2"
rfc2047-decoder = "1"
mailparse = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
# SHA-256 verification of self-update downloads against the GitHub release
# asset digest (see update.rs).
sha2 = "0.10"
# OS credential store for the Email Cleaner module (Windows Credential Manager).
keyring = { version = "3", features = ["windows-native"] }
# Registry walk for detecting the legacy Electron install (see uninstall_old.rs).
winreg = "0.52"
windows = { version = "0.59", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  # Process enumeration + termination for uninstall_old.rs.
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# OS credential store for the Email Cleaner module (macOS Keychain).
keyring = { version = "3", features = ["apple-native"] }
# Self-update on macOS. The Windows build uses the hand-rolled exe-swap in
# update.rs; .app bundles can't be swapped that way, so macOS goes through the
# official plugin (downloads a signed .app.tar.gz and replaces the bundle).
tauri-plugin-updater = "2"

# Thin LTO + 16 codegen units instead of fat LTO + 1: cuts ~2m50s of
# single-threaded tail off every release build for ~0.3-0.5MB of size.
[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
