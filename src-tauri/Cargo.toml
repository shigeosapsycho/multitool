[package]
name = "beu-multitool"
version = "3.8.0"
description = "Beu MultiTool - desktop edition"
authors = ["beu"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "beu_multitool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
notify-debouncer-mini = "0.4"
trash = "5"
chrono = "0.4"
rand = "0.8"
anyhow = "1"
# Self-updater HTTP client (GitHub Releases API + asset download).
ureq = { version = "2", features = ["json", "socks-proxy"] }
base64 = "0.22"
url = "2"
# Email Cleaner module: IMAP client + OS credential storage.
imap = "2.4"
native-tls = "0.2"
keyring = { version = "3", features = ["windows-native"] }
rfc2047-decoder = "1"
mailparse = "0.15"

[target.'cfg(windows)'.dependencies]
# Registry walk for detecting the legacy Electron install (see uninstall_old.rs).
winreg = "0.52"
windows = { version = "0.59", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  # Process enumeration + termination for uninstall_old.rs.
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
