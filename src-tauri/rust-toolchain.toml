[toolchain]
# Use the host's default `stable` toolchain. The channel is intentionally NOT
# pinned to a host tuple (e.g. `-x86_64-pc-windows-msvc`): that name is invalid
# on macOS/Linux and breaks cross-platform builds (cargo metadata: "target tuple
# in channel name"). On Windows you must build with the MSVC host (rustup's
# Windows default) — Tauri's symbol table exceeds the mingw linker's 65k
# export-ordinal limit, so the gnu host fails at link time.
channel = "stable"
profile = "default"
